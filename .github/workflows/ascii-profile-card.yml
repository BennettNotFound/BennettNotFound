name: ASCII profile card

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: hu553in/ascii-profile-card@v1.2.0
        with:
          config: |
            login: BennettNotFound
            uptimeStart: 2022-01-01

            art:
              seed: daily
              width: 420
              columns: 42
              rows: 24

            card:
              align: left
              lines:
                - { type: header, text: 'BennettNotFound' }
                - { type: kv, key: Role, value: 'Developer / debugger' }
                - { type: section, title: 'GitHub stats' }
                - { type: kv, key: Repositories, value: '{repos}' }
                - { type: kv, key: Stars, value: '{stars}' }
                - { type: kv, key: Followers, value: '{followers}' }
                - { type: kv, key: Contributions, value: '{contributions}' }
                - { type: kv, key: Top languages, value: '{topLanguages}' }

            layout:
              fontFamily: "'JetBrains Mono', Consolas, monospace"
              fontSizePx: 14

            output:
              dark: dark_mode.svg
              light: light_mode.svg
